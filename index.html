<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kingsland Publishing</title>

    <meta name="description" content="Kingsland Publishing — Our new website is coming soon.">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: #f8f6f1;
            color: #1f1f1f;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 760px;
            padding: 60px 30px;
        }

        .brand {
            font-size: 42px;
            letter-spacing: 3px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .publisher {
            font-family: Arial, sans-serif;
            font-size: 13px;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 55px;
            color: #666;
        }

        .line {
            width: 70px;
            height: 1px;
            background: #333;
            margin: 0 auto 45px;
        }

        h1 {
            font-size: 48px;
            font-weight: 400;
            margin: 0 0 20px;
        }

        p {
            font-family: Arial, sans-serif;
            font-size: 17px;
            line-height: 1.7;
            color: #555;
            margin: 0 auto;
            max-width: 560px;
        }

        .footer {
            margin-top: 65px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #888;
        }

        @media (max-width: 600px) {
            .brand {
                font-size: 30px;
            }

            h1 {
                font-size: 36px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="brand">Kingsland</div>

        <div class="publisher">Publishing</div>

        <div class="line"></div>

        <h1>Coming Soon</h1>

        <p>
            We are preparing something special for readers, authors,
            and lovers of great books.
        </p>

        <div class="footer">
            © 2026 Kingsland Publishing. All rights reserved.
        </div>

    </main>

</body>
</html>
